# Blueprint mínimo SOLO para el web service.
# La base de datos PostgreSQL se crea ANTES, manualmente en el dashboard de Render,
# y luego se pega el connection string como envvar DATABASE_URL.
#
# Flujo de deploy:
#   1) Render Dashboard → New + → PostgreSQL
#      - Name: cobranzasegurossuda-db
#      - Plan: Starter ($7/mes) ó Free para pruebas
#      - Region: oregon (misma que el web service)
#      - Copiar "Internal Database URL" después de creada
#
#   2) Render Dashboard → New + → Web Service → Build & deploy from Git repo
#      - Repo: https://github.com/alemart87/cobranzasuda
#      - Region: oregon (misma que la DB)
#      - Runtime: Docker (toma el Dockerfile)
#      - Auto-Deploy: Yes
#      - Disk: name=uploads, mount=/var/data, size=10GB
#
#   3) Setear env vars del web service:
#      - DATABASE_URL  = (Internal Database URL del paso 1)
#      - SECRET_KEY    = openssl rand -hex 32
#      - SUPERADMIN_EMAIL          = admin@voicenter.com.py
#      - SUPERADMIN_PASSWORD_HASH  = (bcrypt — ver README)
#      - SUPERADMIN_NAME           = Administrador Voicenter
#      - resto: ver lista abajo

services:
  - type: web
    name: cobranzasegurossuda
    runtime: docker
    plan: starter
    region: oregon
    autoDeploy: true
    healthCheckPath: /health
    dockerfilePath: ./Dockerfile
    envVars:
      # Secretos — setear manualmente en el dashboard
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SUPERADMIN_EMAIL
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      # Valores fijos
      - key: SUPERADMIN_NAME
        value: Administrador Voicenter
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: ENV
        value: production
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_ACCESS_EXPIRE_MINUTES
        value: "60"
      - key: JWT_REFRESH_EXPIRE_DAYS
        value: "7"
      - key: MAX_UPLOAD_SIZE_MB
        value: "20"
      - key: LOG_LEVEL
        value: INFO
      - key: BRAND_PRIMARY_COLOR
        value: "#0066B3"
    disk:
      name: uploads
      mountPath: /var/data
      sizeGB: 10
